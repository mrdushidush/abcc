[workspace]
resolver = "3"
members = [
    "crates/abcc-core",
    "crates/abcc-store",
    "crates/abcc-vcs",
    "crates/abcc-engine",
    "crates/abcc-gate",
    "crates/abcc-drive",
    "crates/abcc-fleet",
    "crates/abcc-tui",
    "crates/abcc",
]

[workspace.package]
version = "0.1.0"
# 🚨 Nothing here goes to crates.io, and saying so is what makes the copied
# dependency gate pass honestly (ADR-0014 §6). `cargo deny`'s `wildcards =
# "deny"` counts a `{ path = ... }` dependency as a wildcard — correctly, it has
# no version requirement — and exempts them only for crates declared private.
# The donor is one published crate and never met this; this is nine unpublished
# ones. ⚠ Deciding to publish is then a visible edit here rather than a flag
# somebody already loosened.
publish = false
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mrdushidush/abcc"
authors = ["David <mrdushidush@gmail.com>"]

[workspace.dependencies]
abcc-core = { path = "crates/abcc-core" }
abcc-store = { path = "crates/abcc-store" }
abcc-vcs = { path = "crates/abcc-vcs" }
abcc-engine = { path = "crates/abcc-engine" }
abcc-gate = { path = "crates/abcc-gate" }
abcc-drive = { path = "crates/abcc-drive" }
abcc-fleet = { path = "crates/abcc-fleet" }
abcc-tui = { path = "crates/abcc-tui" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.39", features = ["bundled"] }
ratatui = "0.30"
crossterm = "0.29"
shared_child = "1"
# ADR-0006 option C: threads own the work and the HTTP client is the blocking
# one. `blocking` + `json` only -- no TLS, because the served endpoint is on this
# machine and every dependency that is not here is a dependency that cannot
# break the build. A cloud provider will need a feature added, which is an edit
# somebody can see rather than a capability that was already sitting there.
# ⚠ Pinned 0.13 rather than the donor's 0.12 (OQ-W3-22), and the upgrade is only
# safe because `tests/http.rs` pins the per-read timeout semantic F198 measured.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"] }
# ripgrep's own crates. `list_files` advertises that it honours the repository's
# ignore rules and `search` advertises a regular expression, so the choice is
# between the reference implementation of those two sentences and a subset that
# would make the head's own tool descriptions overclaim. Neither walks in
# parallel here, so ADR-0006's thread inventory is untouched.
ignore = "0.4"
regex = "1"
# The sprite corpus is PNG and GIF and nothing else (28 files, checked), so the
# decoder is cut to those two. `default-features = false` drops fifteen other
# formats, and with them the dependency surface of a crate that parses untrusted
# bytes -- ADR-0014's deny-the-class applied to a library rather than to a tool.
image = { version = "0.25", default-features = false, features = ["png", "gif"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
